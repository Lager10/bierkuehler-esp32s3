[env:esp32-s3-devkitc-1]
; Arduino-ESP32 3.x / ESP-IDF 5.x via pioarduino (required by current Arduino_GFX QSPI)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; ESP32-S3-WROOM-1-N16R8: 16 MB QSPI flash, 8 MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino@1.6.6
    olikraus/U8g2@2.36.15
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.5
